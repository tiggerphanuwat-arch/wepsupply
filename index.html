<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดจ่ายรายวัน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<style>
/* Layout: staff get one "send an amount" screen; the owner gets an inbox to pay by PromptPay QR, the paper-style daily sheet, contacts, a monthly summary and a printable PDF */
:root{
  --bg:#FFFBEA; --surface:#FFFFFF; --surface-2:#FFF5CC; --line:#F0E3AE;
  --ink:#2A2410; --muted:#6F6647; --accent:#806000; --brand:#FACC15; --accent-ink:#2A2410; --accent-soft:#FFF1B3;
  --sup:#806000; --market:#B4570B; --supply:#5B4FC4; --personal:#B83280; --office:#2B6CB0; --repair:#7A4A2A; --welfare:#0E7490;
  --good:#167A3E; --good-soft:#DCF3E4; --bad:#B42318; --bad-soft:#FBE1DE; --warn:#B45309; --warn-soft:#FDEBD3; --blue:#1D4ED8;
  --font:"IBM Plex Sans Thai",-apple-system,"Sukhumvit Set","Thonburi",system-ui,sans-serif;

  color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
main{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px calc(150px + env(safe-area-inset-bottom,0px));max-width:1180px;width:100%;margin:0 auto;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.headr{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
.gear{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.gear svg{width:19px;height:19px}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:10px;background:var(--accent-soft);color:var(--accent);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.rail{display:none}

.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-bottom:4px;margin-top:-8px;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:22;background:var(--bg)}
.iconbtn{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.datelabel{position:relative;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:0 10px;min-width:0;white-space:nowrap;overflow:hidden}
.datelabel small{font-weight:500;color:var(--accent);font-size:12px}
.datelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.cols{display:grid;grid-template-columns:1fr;gap:14px}
.colstack{display:grid;gap:14px;min-width:0;align-content:start}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);border-top:4px solid var(--c,var(--line))}
.sec-h h2{margin:0;font-size:17px}
.sec-h .sub{font-size:12px;color:var(--muted)}
.sec-h .tot{font-weight:700;font-size:17px;color:var(--c)}
.g-sup{--c:var(--sup)}.g-market{--c:var(--market)}.g-supply{--c:var(--supply)}.g-personal{--c:var(--personal)}.g-office{--c:var(--office)}.g-repair{--c:var(--repair)}.g-welfare{--c:var(--welfare)}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px;padding:6px 14px;font-size:12px;color:var(--muted);background:var(--surface-2)}
.colhead span:last-child{text-align:right}
.r{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:4px 8px;align-items:center;padding:6px 14px;border-top:1px solid var(--line)}
.r:first-of-type{border-top:0}
.r .who{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;min-width:0}
.r .who .nm{flex:0 1 auto;max-width:100%}
.r .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:6px 0;text-align:left;min-width:0}
.amt{height:42px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:right;padding:0 10px;font-size:17px;font-weight:600}
.amt::placeholder{color:var(--line);font-weight:400}
.amt:focus{outline:none;border-color:var(--c,var(--accent));box-shadow:0 0 0 3px var(--accent-soft)}
.amt.filled{background:var(--surface-2);border-color:transparent}
.samts{display:grid;gap:4px;min-width:0}
.samt{width:100%;border:1px solid transparent;border-radius:10px;background:var(--accent-soft);color:var(--ink);text-align:right;padding:5px 10px;font-weight:700;font-size:17px;display:grid;line-height:1.25;cursor:pointer}
.samt small{font-weight:500;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .note{grid-column:1/-1}
.r .note input{width:100%;height:36px;border:1px dashed var(--line);border-radius:9px;background:none;padding:0 10px;font-size:14px}
.notebtn{flex:none;border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;opacity:.55;display:grid;place-items:center}
.notebtn:hover{opacity:1;background:var(--surface-2)}
.addrow{display:flex;align-items:center;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--c,var(--accent));font-weight:600;padding:12px 14px;font-size:14px}
.empty{padding:14px;color:var(--muted);font-size:14px}
.empty b{color:var(--ink)}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 6px;white-space:nowrap}

.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.req:first-of-type{border-top:0}
.req.click{cursor:pointer}.req.click:hover{background:var(--surface-2)}
.req .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req .amtv{font-weight:700;font-size:18px;text-align:right}
.req .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;justify-self:end}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.paybtn{height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--brand);color:var(--accent-ink);font-weight:700;font-size:14px;justify-self:end}

.cashbox{padding:12px 14px;display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.inp{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;width:100%;font-size:16px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.line{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.ovr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ovr div{border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.ovr .k{font-size:12px;color:var(--muted)} .ovr .v{font-size:18px;font-weight:700}
.ovr .over .v{color:var(--blue)} .ovr .short .v{color:var(--bad)}
.grand{background:var(--brand);color:var(--accent-ink);border-color:var(--brand)}
.grand .sec-h{border:0}
.grand .btn{color:var(--ink)}
.tt{padding:0 14px 14px;display:grid;gap:10px}
.tt .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tt .box{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;min-width:0}
.tt .box .k{font-size:12px;opacity:.9}
.tt .box .v{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .line{font-size:14px}
.tt .sep{border-top:1px dashed rgba(255,255,255,.35)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

.sticky{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:25;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sticky .k{font-size:11px;color:var(--muted)} .sticky .v{font-size:18px;font-weight:700;white-space:nowrap}
.sticky .pair{display:flex;gap:16px;min-width:0}
.btn{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--accent-ink)}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5}

/* staff */
.staff{max-width:560px;margin:0 auto;display:grid;gap:14px}
.hello{font-size:22px;font-weight:700;margin:4px 0 0}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.mode button{height:44px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--brand);color:var(--accent-ink)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.step h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.step h2 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:none}
.bigamt{height:64px;font-size:30px;font-weight:700;text-align:center;border-radius:14px}
.sendbtn{height:56px;font-size:18px}
.gseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gseg button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;border-left:4px solid var(--c)}
.gseg button[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}

/* picker */
.ptools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.gseg button:first-child{grid-column:1/-1}
.paypick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paypick button{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;display:grid;place-items:center;padding:6px;color:var(--ink)}
.chkrow{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left;font-weight:600;font-size:15px;color:var(--ink)}
.chkrow i{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;color:transparent;font-size:15px}
.info .it .chkrow,.info .it .btn,.info .it .inp{grid-column:1}
.chkrow small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.chkrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chkrow[aria-pressed="true"] i{background:var(--brand);border-color:var(--brand);color:var(--accent-ink)}
.paytog.mk{border-style:dashed}
.paytog.mk[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:transparent;border-style:solid}
[hidden]{display:none!important}
.paypick.p3{grid-template-columns:repeat(3,1fr)}
.paypick.p3 button{font-size:15px;padding:6px 2px}
.paypick button small{font-weight:400;font-size:12px;color:var(--muted)}
.paypick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.paypick button[aria-pressed="true"] small{color:var(--accent)}
.paytog{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font-size:11px;font-weight:700;padding:3px 9px;line-height:1.3;white-space:nowrap}
.paytog.t{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tt .box .s{font-size:11px;opacity:.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sortseg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:46px}
.sortseg button{border:0;background:var(--surface);padding:0 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.sortseg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.plist{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 14px 6px 10px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface-2)}
.prow:active{background:var(--accent-soft)}
.prow .no{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.prow .pn{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.prow .ch{color:var(--muted)}
.prow.new .pn{color:var(--accent);font-size:16px}
.prow.new .no{font-size:20px;color:var(--accent)}
.newtoday{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:38px;padding:0 12px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
.picked{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:14px;background:var(--accent-soft);border:2px solid var(--accent)}
.picked .k{font-size:12px;color:var(--muted)}
.picked .nmb{font-size:26px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}

/* directory */
.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar .inp{flex:1}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.drow:first-of-type{border-top:0}.drow:hover{background:var(--surface-2)}
.drow .nm{font-weight:600}.drow .meta{font-size:13px;color:var(--muted);grid-column:1;overflow-wrap:anywhere}
.drow .chev{color:var(--muted);grid-row:1/3;grid-column:2}
.missing{color:var(--warn)}.qrtag{color:var(--good);font-weight:600}

/* popup */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.pop{background:var(--surface);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto}
.pop h3{margin:0;font-size:19px}
.popsub{color:var(--muted);font-size:13px;margin-top:-8px}
.info{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.info .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.info .it:first-child{border-top:0}
.info .k{font-size:12px;color:var(--muted);grid-column:1}
.info .v{font-weight:600;font-size:16px;grid-column:1;overflow-wrap:anywhere}
.info .cp{grid-column:2;grid-row:1/3;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--accent-ink);font-weight:700}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.qrcard{display:grid;justify-items:center;gap:8px;padding:14px;border-radius:16px;background:#fff;color:#2A2410;border:1px solid var(--line)}
.qrcard .pp{font-size:12px;font-weight:700;letter-spacing:.06em;color:#0B3D91}
.qrcard svg{width:min(240px,62vw);height:auto;display:block}
.qrcard .qamt{font-size:26px;font-weight:700}
.qrcard .qto{font-size:13px;color:#6F6647;text-align:center}
.payamt{font-size:34px;font-weight:700;text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{left:25px}
.linkbox{font-size:13px;word-break:break-all;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:calc(100% - 32px)}

/* lock */
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lockin{width:100%;max-width:320px;display:grid;gap:18px;justify-items:center;text-align:center}
.lockin h2{margin:0;font-size:20px}
.pins{display:flex;gap:14px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.pins i.on{background:var(--brand)}
.pins.err{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}

 inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>',
 day:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 15h7M9 19h4"/></svg>',

 sum:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>',

 pdf:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M12 10v7M9 14l3 3 3-3"/></svg>'
};
const TABS=[["inbox","รอโอน"],["day","รายวัน"],["dir","รายชื่อ"],["sum","สรุปเดือน"]];

/* helpers */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const thD=s=>pd(s).toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"short",year:"numeric"});
const thDs=s=>pd(s).toLocaleDateString("th-TH",{day:"numeric",month:"short"});
const thM=m=>{const[a,b]=m.split("-").map(Number);return new Date(a,b-1,1).toLocaleDateString("th-TH",{month:"long",year:"numeric"})};
const addM=(m,n)=>{const[a,b]=m.split("-").map(Number);const d=new Date(a,b-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const hm=t=>t?new Date(t).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}):"";
const money=n=>(Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(Number(n)||0).toLocaleString("th-TH",{maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const THD="๐๑๒๓๔๕๖๗๘๙";
const thaiDigits=s=>String(s).replace(/[๐-๙]/g,c=>String(THD.indexOf(c)));
const num=v=>{if(v==null)return null;const s=thaiDigits(v).replace(/[,\s฿]/g,"");if(!s)return null;const n=Number(s);return isFinite(n)?r2(n):null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* number-only inputs: Thai digits become Arabic, letters are dropped */
function cleanNum(v,mode){v=thaiDigits(v);if(mode==="decimal"){v=v.replace(/[^0-9.,]/g,"");const i=v.indexOf(".");if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"");return v}return v.replace(/[^0-9\- ]/g,"")}
document.addEventListener("input",e=>{const t=e.target;if(t.tagName!=="INPUT")return;const m=t.getAttribute("inputmode");if(m!=="decimal"&&m!=="numeric"&&m!=="tel")return;const c=cleanNum(t.value,m==="decimal"?"decimal":"id");if(c!==t.value){t.value=c;try{t.setSelectionRange(c.length,c.length)}catch(x){}}},true);

/* PromptPay (Thai QR, EMVCo) */
function tlv(id,v){return id+pad(v.length)+v}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function ppTarget(id){const d=String(id||"").replace(/\D/g,"");
  if(d.length===10&&d[0]==="0")return tlv("01","0066"+d.slice(1));
  if(d.length===13)return tlv("02",d);
  if(d.length===15)return tlv("03",d);
  return null}
function ppPayload(id,amount){const t=ppTarget(id);if(!t)return null;
  const s=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("29",tlv("00","A000000677010111")+t)+tlv("53","764")+(amount?tlv("54",Number(amount).toFixed(2)):"")+tlv("58","TH")+"6304";
  return s+crc16(s)}
function qrSvg(text){try{if(typeof qrcode!=="function")return null;const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){return null}}

/* store */
let db=null,USER=null,DL=null;const un={},qs={};
const Q=(k,f)=>(qs[k]=(qs[k]||Promise.resolve()).catch(()=>{}).then(f));

  patchDay(date,patch){
    return Q("days/"+date,async()=>{const ref=db.doc("days/"+date);

        if(e&&e.code==="invalid_argument"){const s=await ref.get();if(s.exists)throw e;await ref.set(Object.assign({date},patch))}

/* subscriptions */

/* PIN lock */
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return "w"+h}}
const pinHash=(pin,salt)=>sha((salt||"")+":"+pin);
let unlockedOnce=false,hiddenAt=0;
function needHash(){return S.role==="owner"?S.lock.ownerHash:S.lock.staffHash}
function evalLock(){const should=S.lock.enabled&&!!needHash()&&!unlockedOnce;if(should!==S.lock.locked){S.lock.locked=should;S.lock.entry=""}drawLock()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>5*60000&&S.lock.enabled&&needHash()){unlockedOnce=false;evalLock()}});
function drawLock(msg){
  const r=document.getElementById("lockroot");
  if(!S.lock.locked){r.innerHTML="";return}
  const n=S.lock.entry.length;
  r.innerHTML='<div class="lock"><div class="lockin"><span class="mark" style="width:52px;height:52px;font-size:22px;border-radius:14px">฿</span><h2>ใส่รหัส PIN</h2><div style="color:var(--muted);font-size:14px;margin-top:-10px">'+(S.role==="owner"?"PIN ของเจ้าของร้าน":"PIN ของพนักงาน")+'</div><div class="pins" id="pins">'+[0,1,2,3].map(i=>'<i class="'+(i<n?"on":"")+'"></i>').join("")+'</div><div class="lockmsg" id="lockmsg">'+esc(msg||"")+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9].map(k=>'<button data-k="'+k+'">'+k+'</button>').join("")+'<button class="txt" data-k="clr">ล้าง</button><button data-k="0">0</button><button class="txt" data-k="del">ลบ</button></div>'+(S.role==="owner"?'<div style="font-size:12px;color:var(--muted)">ลืมรหัส: กด “ออกจากระบบ” แล้วเข้าสู่ระบบใหม่ จะเข้าได้ทันที</div><button class="btn sm" id="lklogout" style="justify-self:center">ออกจากระบบ</button>':'<div style="font-size:12px;color:var(--muted)">ลืมรหัส: ถามเจ้าของร้าน</div>')+'</div></div>';
  r.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>pinKey(b.dataset.k)));
  const lk=document.getElementById("lklogout");lk&&lk.addEventListener("click",logout);
}
document.addEventListener("keydown",e=>{if(!S.lock.locked)return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("del")});
async function pinKey(k){
  if(Date.now()<S.lock.until){drawLock("ใส่ผิดหลายครั้ง รอสักครู่แล้วลองใหม่");return}
  if(k==="del")S.lock.entry=S.lock.entry.slice(0,-1);else if(k==="clr")S.lock.entry="";else if(S.lock.entry.length<4)S.lock.entry+=k;
  drawLock();
  if(S.lock.entry.length===4){const h=await pinHash(S.lock.entry,S.lock.salt);
    if(h===needHash()){unlockedOnce=true;S.lock.fails=0;S.lock.locked=false;S.lock.entry="";drawLock();render()}
    else{S.lock.fails++;S.lock.entry="";if(S.lock.fails>=5){S.lock.until=Date.now()+30000;S.lock.fails=0}drawLock(S.lock.until>Date.now()?"ใส่ผิด 5 ครั้ง รอ 30 วินาที":"รหัสไม่ถูกต้อง");const p=document.getElementById("pins");p&&p.classList.add("err")}}
}

/* calc */
function dirBy(g){return S.dir.filter(x=>x.group===g).sort((a,b)=>(a.order||0)-(b.order||0))}
const live=r=>!r.deleted&&r.status!=="rejected"&&r.status!=="cancelled";
function reqsOn(date,kind){const out=[];for(const k in S.reqs)S.reqs[k].forEach(r=>{if(r.date===date&&live(r)&&(r.kind||"transfer")===kind)out.push(r)});return out.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
const gOf=r=>GROUPS[r.group]?r.group:"sup";
const payR=r=>r.kind==="cash"?"cash":"transfer";                       // รายการจากพนักงาน: kind = วิธีจ่าย
const payE=e=>e.pay==="transfer"||e.pay==="cash"?e.pay:defPay(e.group); // รายการที่เจ้าของใส่เอง
function reqsAll(date){const out=[];for(const k in S.reqs)S.reqs[k].forEach(r=>{if(r.date===date&&live(r))out.push(r)});return out.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
const reqsG=(date,g)=>reqsAll(date).filter(r=>gOf(r)===g);
const CORE_NAMES=["ค่าวิน"];const coreByName=(g,n)=>g==="supply"&&CORE_NAMES.includes((n||"").trim());
function totals(day,date){
  const E=(day&&day.entries)||{};const t={sup:0,supPaid:0,supPend:0,payT:0,payC:0,coreT:0,coreC:0,drawer:0,supC:0,mktX:0,win:0};CASHG.forEach(g=>t[g]=0);
  const add=(g,a,p,nm)=>{t[g]+=a;if(p==="transfer")t.payT+=a;else t.payC+=a;const cn=coreByName(g,nm);if(cn)t.win+=a;if(GROUPS[g].core||cn){if(p==="transfer")t.coreT+=a;else t.coreC+=a}if(p==="cash"&&(g==="sup"||g==="market"||g==="supply"))t.drawer+=a;if(p==="cash"&&g==="sup")t.supC+=a};
  for(const id in E){const e=E[id];if(!e||e.deleted||e.amount==null||t[e.group]==null||e.group==="sup")continue;add(e.group,e.amount,payE(e),e.name);if(e.mkt&&OTHERG.includes(e.group)&&payE(e)==="cash")t.mktX+=e.amount}
  reqsAll(date).forEach(r=>{const g=gOf(r),a=r.amount||0,p=payR(r);add(g,a,p,r.name);if(r.mkt&&OTHERG.includes(g)&&p==="cash")t.mktX+=a;if(g==="sup"&&p==="transfer"){if(r.status==="paid")t.supPaid+=a;else t.supPend+=a}});
  for(const k in t)t[k]=r2(t[k]);
  t.cash=r2(t.drawer+t.mktX);t.core=r2(t.sup+t.market+t.win);t.other=r2(OTHERG.reduce((s,g)=>s+t[g],0));t.all=r2(t.sup+t.market+t.supply+t.other);
  const c=(day&&day.cash)||{};t.opening=c.opening;t.left=c.left;
  t.expect=c.opening!=null?r2(c.opening-t.cash):null;
  t.diff=(t.expect!=null&&c.left!=null)?r2(c.left-t.expect):null;
  return t;
}

function groupBySp(rs){const out=[],m={};rs.forEach(r=>{if(r.sp){if(!m[r.sp]){m[r.sp]={parts:[]};out.push(m[r.sp])}m[r.sp].parts.push(r)}else out.push({parts:[r]})});out.forEach(g=>g.parts.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)));return out}

/* ---- owner: summary ---- */
function monthAgg(){
  const per={};const by={};const tot={payT:0,payC:0,coreT:0,coreC:0,win:0};["sup",...CASHG].forEach(g=>tot[g]=0);
  const dates=new Set(S.mdays.map(d=>d.date));for(const k in S.reqs)S.reqs[k].forEach(r=>{if(r.date&&r.date.slice(0,7)===S.month)dates.add(r.date)});
  const add=(g,n,a,c1)=>{const k=g+"|"+n;(by[k]||(by[k]={g,n,a:0,c:0})).a+=a;if(c1!==false)by[k].c++};
  dates.forEach(date=>{const day=S.mdays.find(d=>d.date===date);const t=totals(day,date);per[date]=t;["sup",...CASHG,"payT","payC","coreT","coreC","win"].forEach(g=>tot[g]+=t[g]);
    const E=(day&&day.entries)||{};for(const id in E){const e=E[id];if(!e||e.deleted||e.amount==null||e.group==="sup")continue;add(e.group,e.name,e.amount)}
    {const seen=new Set();reqsAll(date).forEach(r=>{const first=!(r.sp&&seen.has(r.sp));if(r.sp)seen.add(r.sp);add(gOf(r),r.name,r.amount||0,first)})}});
  const cs={short:0,over:0,nShort:0,nOver:0,nOk:0,days:[]};Object.keys(per).sort().forEach(d=>{const df=per[d].diff;if(df==null)return;if(df<0){cs.short+=-df;cs.nShort++;cs.days.push({d,df})}else if(df>0){cs.over+=df;cs.nOver++;cs.days.push({d,df})}else cs.nOk++});cs.short=r2(cs.short);cs.over=r2(cs.over);cs.counted=cs.nShort+cs.nOver+cs.nOk;cs.net=r2(cs.over-cs.short);
  for(const k in tot)tot[k]=r2(tot[k]);
  tot.core=r2(tot.sup+tot.market+tot.win);tot.other=r2(OTHERG.reduce((s,g)=>s+tot[g],0));tot.all=r2(tot.sup+tot.market+tot.supply+tot.other);
  return {per,by,tot,cs};
}

  if(!cs.counted)return '<div class="sec" style="margin-bottom:14px"><div class="sec-h"><div><h2>เงินหาย / เงินเกินรวม</h2><div class="sub">จากการนับเงินสดปิดวัน</div></div></div><div class="empty">ยังไม่มีวันที่นับเงินสดในเดือนนี้<br>กรอก “เงินตั้งต้น” และ “เงินที่เหลือ (นับจริง)” ในหน้ารายวัน แล้วยอดจะมารวมที่นี่</div></div>';
  return '<div class="sec" style="margin-bottom:14px"><div class="sec-h"><div><h2>เงินหาย / เงินเกินรวม</h2><div class="sub">จากการนับเงินสดปิดวัน · นับแล้ว '+cs.counted+' วัน</div></div>'+net+'</div>'+
    '<div class="ovr mcash"><div class="short"><div class="k">เงินหายรวม</div><div class="v num">'+(cs.short?money(cs.short):"–")+'</div><div class="n">'+(cs.nShort?cs.nShort+' วัน':'ไม่มี')+'</div></div><div class="over"><div class="k">เงินเกินรวม</div><div class="v num">'+(cs.over?money(cs.over):"–")+'</div><div class="n">'+(cs.nOver?cs.nOver+' วัน':'ไม่มี')+'</div></div></div>'+
    (cs.days.length?'<div class="mdays">'+cs.days.map(x=>'<button type="button" class="mday" data-act="goto" data-date="'+x.d+'"><span>'+esc(thDs(x.d))+'</span><b class="num '+(x.df<0?'sh':'ov')+'">'+(x.df<0?'หาย '+money(-x.df):'เกิน '+money(x.df))+'</b></button>').join("")+'</div>':'<div style="padding:0 14px 12px;font-size:13px;color:var(--muted)">ทุกวันที่นับ เงินสดตรงพอดี</div>')+'</div>'}

  h+=cashSumHTML(cs)+'<div class="cols"><div class="colstack">';

  let bars="",ax="";for(let i=1;i<=dim;i++){const k=S.month+"-"+pad(i);const t=per[k]||{core:0,other:0,all:0};const H=v=>mx?v/mx*100:0;

  h+='<div class="sec"><div class="sec-h"><div><h2>ค่าใช้จ่ายรายวัน</h2><div class="sub">สูงสุด '+money(mx)+' บาท · แตะแท่งเพื่อเปิดวันนั้น</div></div></div><div class="legend"><span><i class="sw" style="background:var(--sup)"></i> ซัพ + ตลาด + ค่าวิน</span><span><i class="sw" style="background:var(--personal)"></i> วัสดุ ส่วนตัว สำนักงาน ซ่อมแซม สวัสดิการ</span></div><div class="chart"><div class="bars">'+bars+'</div><div class="axis num">'+ax+'</div></div></div>';

    const sc=S.cat?cats.find(c=>c.g===S.cat):null;
    const ctr=sc?'<text class="dc-l" x="100" y="90" text-anchor="middle">'+esc(GROUPS[sc.g].t)+'</text><text class="dc-v" x="100" y="112" text-anchor="middle">'+money(sc.a)+'</text><text class="dc-l" x="100" y="130" text-anchor="middle">'+pc(sc.a)+' ของทั้งหมด</text>':'<text class="dc-l" x="100" y="90" text-anchor="middle">รวมทุกอย่าง</text><text class="dc-v" x="100" y="112" text-anchor="middle">'+money(tot.all)+'</text><text class="dc-l" x="100" y="130" text-anchor="middle">'+cats.length+' หมวด</text>';

      '<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="วงกลมแสดงสัดส่วนค่าใช้จ่ายแต่ละหมวด">'+arcs+ctr+'</svg></div>'+
      '<div class="cats">'+cats.map(c=>'<button type="button" class="catrow g-'+c.g+'" data-act="cat" data-g="'+c.g+'" aria-pressed="'+(S.cat===c.g)+'"><span class="sw" style="background:'+gvar(c.g)+'"></span><span class="cn">'+esc(GROUPS[c.g].t)+'</span><span class="cp">'+pc(c.a)+'</span><span class="ca num">'+money(c.a)+'</span><span class="cc" aria-hidden="true">'+(S.cat===c.g?'⌃':'⌄')+'</span></button>').join("")+'</div></div>';
    if(sc){const rows=Object.values(by).filter(r=>r.g===sc.g).sort((a,b)=>b.a-a.a);const top=rows.length?rows[0].a:0;
      h+='<div class="sec g-'+sc.g+'"><div class="sec-h"><div><h2>'+esc(GROUPS[sc.g].t)+'</h2><div class="sub">'+rows.length+' รายชื่อ · เรียงจากจ่ายมากสุด</div></div><div class="tot num">'+money(sc.a)+'</div></div>'+(rows.length?'<div class="tw"><table><thead><tr><th>รายชื่อ</th><th class="tr">ครั้ง</th><th class="tr">บาท</th></tr></thead><tbody>'+rows.map(r=>'<tr><td style="white-space:normal">'+esc(r.n)+'<div class="hb"><i style="width:'+(top?r.a/top*100:0)+'%;background:'+gvar(r.g)+'"></i></div></td><td class="tr num">'+r.c+'</td><td class="tr num">'+money(r.a)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">ไม่มีรายการ</div>')+'</div>'}
  }
  return h+'<button class="btn" data-act="copym">คัดลอกสรุปเดือนนี้</button></div></div>';
}

  else if(payload)qr='<div class="empty" style="padding:0">สร้าง QR ไม่ได้ตอนนี้ ใช้เลขบัญชีด้านล่างแทน</div>';
  else qr=isNew?'':'<div class="banner warn" style="margin:0">ยังไม่มีพร้อมเพย์ของ '+esc(r.name)+' เลยสร้าง QR ไม่ได้ <button class="btn sm" id="addpp">เพิ่มพร้อมเพย์</button></div>';
  const newBox=isNew?'<div class="banner" style="margin:0;display:grid;gap:8px"><b>'+(gOf(r)==="sup"?"ซัพใหม่":"รายการใหม่")+'จาก'+esc(who(r.staff))+'</b><span>ชื่อนี้ยังไม่อยู่ในรายชื่อ ถ้าไม่เพิ่ม จะใช้ได้แค่วันนี้วันเดียว</span><button class="btn primary sm" id="addnew">เพิ่ม “'+esc(r.name)+'” เข้ารายชื่อ</button></div>':'';
  const acc=d.account?'<div class="info"><div class="it"><div class="k">'+esc(d.bank||"เลขบัญชี")+(d.holder?' · '+esc(d.holder):'')+'</div><div class="v num">'+esc(d.account)+'</div><button class="cp" data-copy="'+esc(d.account.replace(/\D/g,"")||d.account)+'">คัดลอก</button></div></div>':'';
  pop('<h3>'+esc(r.name)+'</h3><div class="popsub">ส่งโดย '+esc(who(r.staff))+' · '+esc(thDs(r.date))+' '+hm(r.createdAt)+(r.note?' · '+esc(r.note):'')+'</div>'+newBox+
    (paid?'<div class="payamt num">฿'+money(r.amount)+'</div><span class="pill good" style="justify-self:center">โอนแล้ว '+hm(r.paidAt)+'</span>'+acc+'<button class="btn sm" id="tocash" style="justify-self:center">เปลี่ยนเป็นจ่ายเงินสด</button><div class="acts"><button class="btn" id="undo">ยกเลิกสถานะโอน</button><button class="btn primary" id="x">ปิด</button></div>':
     qr+acc+'<div class="fld"><label for="p-amt">ยอดที่จะโอน (แก้ได้ถ้าซัพแจ้งยอดใหม่)</label><input class="inp num" id="p-amt" inputmode="decimal" value="'+r.amount+'"></div>'+
     '<button class="btn primary block sendbtn" id="done">โอนแล้ว</button>'+(isHold(r)?'<button class="btn sm" id="unhold" style="justify-self:center">เอาออกจากยังไม่โอน (โอนเลย)</button>':'<button class="btn sm" id="hold" style="justify-self:center">ยังไม่โอน · รอโอนวันที่ 3–5</button>')+'<button class="btn sm" id="tocash" style="justify-self:center">จ่ายเป็นเงินสดแทน</button><div class="acts"><button class="btn danger" id="rej">ส่งกลับ</button><button class="btn" id="x">ปิด</button></div>'),p=>{

async function saveQr(payload,r){
  try{const q=qrcode(0,"M");q.addData(payload);q.make();const n=q.getModuleCount(),cs=10,m=4,size=(n+m*2)*cs;
    const c=document.createElement("canvas");c.width=size;c.height=size+90;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(q.isDark(i,j))x.fillRect((j+m)*cs,(i+m)*cs,cs,cs);
    x.font="bold 28px sans-serif";x.textAlign="center";x.fillText("฿"+money(r.amount),size/2,size+36);x.font="22px sans-serif";x.fillText(r.name,size/2,size+70);
    const blob=await new Promise(res=>c.toBlob(res,"image/png"));await DL.save({filename:"QR-"+r.name+"-"+money0(r.amount)+".png",data:blob});toast("บันทึกรูปแล้ว")}
  catch(e){if(!(e&&e.code==="declined"))toast("บันทึกรูปไม่ได้")}
}

/* PDF (A4, drawn on canvas, wrapped in a minimal PDF — no external library) */
function sheetData(){
  const t=totals(S.day,S.date);const E=(S.day&&S.day.entries)||{};
  const supRows=[];const used=new Set();
  const R=reqsG(S.date,"sup");
  const stat=r=>payR(r)==="cash"?"เงินสด":(r.status==="paid"?"โอนแล้ว":isHold(r)?"ยังไม่โอน":"รอโอน");
  const mix=(rs,def)=>rs.some(r=>payR(r)==="cash")&&rs.some(r=>payR(r)==="transfer")?"เงินสด "+money0(spSum(rs.filter(r=>payR(r)==="cash")))+" + โอน "+money0(spSum(rs.filter(r=>payR(r)==="transfer"))):def;
  dirBy("sup").forEach((d,i)=>{const rs=R.filter(r=>r.supId===d.id||(!r.supId&&r.name===d.name));rs.forEach(r=>used.add(r.id));
    const a=rs.reduce((s,r)=>s+(r.amount||0),0);const pend=rs.some(r=>payR(r)==="transfer"&&r.status!=="paid");const allCash=rs.length&&rs.every(r=>payR(r)==="cash");
    supRows.push([d.name,rs.length?a:null,rs.length?mix(rs,allCash?"เงินสด":pend?"รอโอน":"โอนแล้ว")+(rs.map(r=>r.note).filter(Boolean).length?" · "+rs.map(r=>r.note).filter(Boolean).join(", "):""):""])});
  groupBySp(R.filter(r=>!used.has(r.id))).forEach(it=>{const rs=it.parts,r=rs[0];supRows.push([r.name+" (ใหม่)",spSum(rs),mix(rs,stat(r))+(r.note?" · "+r.note:"")])});
  const plab=(p,g)=>p!==defPay(g)?PAYL[p]:"";
  const grp=g=>{const rows=[];const j=(...a)=>a.filter(Boolean).join(" · ");
    const Rg=reqsG(S.date,g);const skip=new Set();
    if(GROUPS[g].named)dirBy(g).forEach(d=>{const e=E[d.id];
      if(e&&e.amount!=null){rows.push([d.name,e.amount,j(plab(payE(Object.assign({group:g},e)),g),e.note)]);return}
      const rs=Rg.filter(r=>r.supId===d.id||(!r.supId&&r.name===d.name));
      if(rs.length){rs.forEach(r=>skip.add(r.id));rows.push([d.name,r2(rs.reduce((a,r)=>a+(r.amount||0),0)),j(mix(rs,rs.some(r=>payR(r)==="transfer")?stat(rs.find(r=>payR(r)==="transfer")):""),rs.map(r=>r.note).filter(Boolean).join(", "),"ลงโดย "+who(rs[0].staff))])}
      else rows.push([d.name,null,e&&e.note||""])});
    {const ex=Object.entries(E).filter(([id,e])=>e&&!e.deleted&&e.group===g&&id.startsWith("x_")).map(([id,e])=>Object.assign({id},e));const seen=new Set();
      ex.forEach(e=>{const ps=e.sp?ex.filter(z=>z.sp===e.sp):[];if(ps.length>1){if(seen.has(e.sp))return;seen.add(e.sp);rows.push([e.name,spSum(ps),j(spLabel(ps),e.note)])}else rows.push([e.name,e.amount,j(plab(payE(e),g),e.note)])})}
    groupBySp(Rg.filter(r=>!skip.has(r.id))).forEach(it=>{const rs=it.parts,r=rs[0];rows.push([r.name,spSum(rs),j(rs.length>1?spLabel(rs):(payR(r)==="transfer"?stat(r):""),r.note,"ลงโดย "+who(r.staff))])});
    return rows};
  return {t,supRows,grp};
}

function jpegPdf(canvas){
  const b64=canvas.toDataURL("image/jpeg",.9).split(",")[1];const bin=atob(b64);const img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  const enc=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
  const parts=[],offs=[];let len=0;const put=u=>{parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;put(enc(n+" 0 obj\n"+body+"\nendobj\n"))};
  put(enc("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  offs[4]=len;put(enc("4 0 obj\n<< /Type /XObject /Subtype /Image /Width "+canvas.width+" /Height "+canvas.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+img.length+" >>\nstream\n"));put(img);put(enc("\nendstream\nendobj\n"));
  const cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";obj(5,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  const xref=len;let xr="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)xr+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  put(enc(xr+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n"));
  return new Blob(parts,{type:"application/pdf"});
}

  groupBySp(reqsG(S.date,"sup")).forEach(it=>{const rs=it.parts,r=rs[0];L.push("- "+r.name+" "+money0(spSum(rs))+(rs.length>1?" ("+spLabel(rs)+")":payR(r)==="cash"?" (เงินสด)":r.status!=="paid"?(isHold(r)?" (ยังไม่โอน)":" (รอโอน)"):""))});
  CASHG.forEach(g=>{const items=grp(g).filter(r=>r[1]!=null);if(!items.length)return;L.push("",GROUPS[g].t+" "+money(t[g]));items.forEach(r=>L.push("- "+r[0]+" "+money0(r[1])))});
  L.push("","เงินสดที่จ่าย (ตลาด+วัสดุ"+(t.supC?" + ซัพที่จ่ายสด":"")+(t.mktX?" + หมวดอื่นที่ใช้เงินตลาด "+money0(t.mktX):"")+") "+money(t.cash));if(t.diff)L.push(t.diff>0?"เงินเกิน "+money(t.diff):"เงินขาด "+money(-t.diff));
  L.push("","1) รวมทุกอย่าง "+money(t.all)+" (โอน "+money0(t.payT)+" / เงินสด "+money0(t.payC)+")","2) ค่าใช้จ่ายร้าน (ซัพ+ตลาด+ค่าวิน) "+money(t.core)+" (โอน "+money0(t.coreT)+" / เงินสด "+money0(t.coreC)+")");return L.join("\n")}
function monthText(){const {tot,cs}=monthAgg();return["สรุปค่าใช้จ่าย "+thM(S.month),...["sup",...CASHG].map(g=>GROUPS[g].t+" "+money(tot[g])),"","1) รวมทุกอย่าง "+money(tot.all)+" (โอน "+money0(tot.payT)+" / เงินสด "+money0(tot.payC)+")","2) ค่าใช้จ่ายร้าน (ซัพ+ตลาด+ค่าวิน) "+money(tot.core)+" (โอน "+money0(tot.coreT)+" / เงินสด "+money0(tot.coreC)+")",...(cs.counted?["","เงินหายรวม "+(cs.short?money(cs.short)+" ("+cs.nShort+" วัน)":"ไม่มี"),"เงินเกินรวม "+(cs.over?money(cs.over)+" ("+cs.nOver+" วัน)":"ไม่มี")]:[])].join("\n")}

function onClick(e){
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;const st=S.staff;
  if(a==="pay"){e.stopPropagation();return payPop(el.dataset.staff,id)}
  if(a==="toowner"){location.hash="owner";return}
  if(a==="dprev")setDate(addD(S.date,-1));else if(a==="dnext")setDate(addD(S.date,1));
  else if(a==="mprev")setMonth(addM(S.month,-1));else if(a==="mnext")setMonth(addM(S.month,1));
  else if(a==="info")infoPop(id);
  else if(a==="extra")extraPop(el.dataset.g,id);
  else if(a==="addx")extraPop(el.dataset.g);
  else if(a==="staffcash")staffCashPop(el.dataset.staff,id);
  else if(a==="ownadd")ownAddPop();
  else if(a==="note"){S.openNotes[id]=true;render();const n=document.getElementById("n-"+id);n&&n.focus()}
  else if(a==="dnew")editPop(null);
  else if(a==="cat"){S.cat=S.cat===el.dataset.g?null:el.dataset.g;render()}else if(a==="goto"){S.tab="day";setDate(el.dataset.date);window.scrollTo(0,0)}
  else if(a==="copy")copy(dayText());else if(a==="copym")copy(monthText());
  else if(a==="pdf")makePdf();
  else if(a==="mine")minePop(id);
  else if(a==="splitreq")splitReqPop(el.dataset.sp);
  else if(a==="splitmine")splitMinePop(el.dataset.sp);
  else if(a==="splitent")splitEntPop(el.dataset.sp);
  else if(a==="mkttog"){store.patchDay(S.date,{entries:{[id]:{name:el.dataset.name,group:el.dataset.g,mkt:el.dataset.v!=="1"}}}).catch(fail)}
  else if(a==="spay"){st.pay=el.dataset.p;if(st.pay!=="cash")st.mkt=false;render()}
  else if(a==="smkt"){st.mkt=!st.mkt;render()}
  else if(a==="ssplit"){st.split=!st.split;render()}
  else if(a==="sst"){st.stT=el.dataset.p;render()}
  else if(a==="paytog"){const np=el.dataset.p==="transfer"?"cash":"transfer";store.patchDay(S.date,{entries:{[id]:{name:el.dataset.name,group:el.dataset.g,pay:np}}}).catch(fail)}
  else if(a==="sgroup"){st.group=el.dataset.g;st.pay=defPay(st.group);st.mkt=false;st.split=false;st.amt2="";st.stT="done";st.sel=null;st.q="";st.newName="";render()}
  else if(a==="spick"){const n=S.names.find(x=>x.id===id);if(n){st.sel={id:n.id,name:n.name};render();const am=document.getElementById("s-amt");am&&am.focus()}}
  else if(a==="spicktemp"){st.sel={id:null,name:el.dataset.name,isNew:true};render();const am=document.getElementById("s-amt");am&&am.focus()}
  else if(a==="snew"){const nm=st.q.trim();if(nm){st.sel={id:null,name:nm,isNew:true};render();const am=document.getElementById("s-amt");am&&am.focus()}else newNamePop(n=>{close();st.sel={id:null,name:n,isNew:true};render();const am=document.getElementById("s-amt");am&&am.focus()})}
  else if(a==="sunpick"){st.sel=null;render()}
  else if(a==="ssort"){st.sort=el.dataset.s;try{localStorage.setItem("sj3_sort",st.sort)}catch(x){}render()}
  else if(a==="send"){
    const amt=num(document.getElementById("s-amt").value);const noteV=document.getElementById("s-note").value.trim();
    let sel=st.sel;
    if(!hasList(st.group)&&!sel){const fv=(document.getElementById("s-free")||{}).value||"";if(fv.trim())sel={id:null,name:fv.trim(),isNew:false,free:true}}
    if(!sel){toast(st.group==="sup"?"เลือกซัพก่อน":"เลือกหรือพิมพ์รายการก่อน");return}
    if(amt==null||amt<=0){toast("ใส่ยอดก่อน");document.getElementById("s-amt").focus();return}
    if(st.split){const amt2=num((document.getElementById("s-amt2")||{}).value);if(amt2==null||amt2<=0){toast("ใส่ยอดที่โอนด้วย");const e3=document.getElementById("s-amt2");e3&&e3.focus();return}

      const b1=reqBody("cash",Object.assign({amount:amt,mkt:!!(st.mkt&&OTHERG.includes(st.group)),sp,createdAt:Date.now()},base));
      const b2=reqBody(st.stT,Object.assign({amount:amt2,sp,createdAt:Date.now()+1},base));
      if(sel.isNew){b1.newName=true;b2.newName=true}

    const body=reqBody(st.pay,{group:st.group,mkt:!!(st.mkt&&st.pay==="cash"&&OTHERG.includes(st.group)),date:S.date,supId:sel.id||null,name:sel.name,amount:amt,note:noteV,createdAt:Date.now()});
    if(sel.isNew)body.newName=true;
    el.disabled=true;
    store.sendReq(body).then(()=>{toast(payTxt[st.pay][1]+sel.name+" "+money(amt)+" แล้ว");staffReset();render();window.scrollTo(0,0)}).catch(e2=>{el.disabled=false;fail(e2)})}
  else if(a==="import"){el.disabled=true;let o=0;const jobs=[];const list=[];for(const g in DEFAULTS)DEFAULTS[g].forEach(n=>{o++;const did="d"+pad(o);list.push({id:did,name:n,group:g,order:o});jobs.push(store.saveDir(did,{name:n,group:g,order:o}))});
    Promise.all(jobs).then(()=>store.saveNames(list)).then(()=>toast("ใส่รายชื่อแล้ว")).catch(fail)}
}

  const mkErr=e=>{const x=new Error((e&&e.message)||"error"),c=(e&&e.code)||"",m=(e&&e.message)||"";
    x.code=(c==="P0002"||c==="42501"||c==="PGRST116"||/row-level security|doc_not_found|permission denied/i.test(m))?"invalid_argument":(/fetch|network|load failed|timeout/i.test(m)?"unavailable":"error");return x};

  const bump=path=>{const c=split(path).coll;LS.forEach(l=>{if(l.path===path||l.coll===c)l.sched()})};
  const refresh=()=>LS.forEach(l=>l.sched());
  function startRT(){
    if(chan)return;

      .subscribe(s=>{if(s==="SUBSCRIBED")refresh()});

    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
    window.addEventListener("online",refresh);
  }
  function listen(l,errcb){
    l.sched=()=>{clearTimeout(l.t);l.t=setTimeout(()=>l.run().catch(e=>{errcb&&errcb(e)}),90)};
    LS.add(l);startRT();l.run().catch(e=>{errcb&&errcb(e)});
    return()=>{clearTimeout(l.t);LS.delete(l)};
  }
  const snap=(id,data)=>({id,exists:data!=null,data:()=>data,metadata:{fromCache:false}});
  function refDoc(path){const{coll,id}=split(path);const o={
    id,path,
    async get(){const{data,error}=await cl.from("docs").select("data").eq("path",path).maybeSingle();if(error)throw mkErr(error);return snap(id,data&&data.data)},
    async set(d){const{error}=await cl.from("docs").upsert({path,coll,id,data:d,updated_at:new Date().toISOString()},{onConflict:"path"});if(error)throw mkErr(error);bump(path)},
    async update(patch){const{error}=await cl.rpc("doc_update",{p_path:path,p_patch:patch});if(error)throw mkErr(error);bump(path)},
    async delete(){const{error}=await cl.from("docs").delete().eq("path",path);if(error)throw mkErr(error);bump(path)},
    onSnapshot(cb,errcb){return listen({path,coll:null,async run(){cb(await o.get())}},errcb)}
  };return o}
  function refCol(coll,wh){wh=wh||[];const q=async()=>{let r=cl.from("docs").select("id,data").eq("coll",coll);
      wh.forEach(([f,op,v])=>{r=r.filter("data->>"+f,OPS[op]||"eq",v)});const{data,error}=await r.limit(1000);if(error)throw mkErr(error);
      return{docs:(data||[]).map(x=>({id:x.id,exists:true,data:()=>x.data})),metadata:{fromCache:false}}};
    return{doc:id=>refDoc(coll+"/"+id),where:(f,op,v)=>refCol(coll,[...wh,[f,op,v]]),get:q,
      onSnapshot(cb,errcb){return listen({path:null,coll,async run(){cb(await q())}},errcb)}}}
  const db={doc:refDoc,collection:c=>refCol(c)};
  const user={
    id:async()=>(await cl.auth.getSession()).data.session.user.id,
    profiles:async ids=>{const{data,error}=await cl.from("profiles").select("id,name").in("id",ids);if(error)throw mkErr(error);const m={};(data||[]).forEach(p=>m[p.id]={name:p.name});return m}
  };

    const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000)}};
  return{cl,db,user,dl,mkErr,
    async session(){try{return(await cl.auth.getSession()).data.session}catch(e){return null}},
    async profile(id){try{const{data}=await cl.from("profiles").select("name,role").eq("id",id).maybeSingle();return data}catch(e){return null}}};

  if(LG.busy)return;const st=LG.tab==="staff";let email,pw,meta=null;
  const bad=m=>{LG.msg=m;showLogin()};
  if(st){const nm=normName(LG.name);if(!nm)return bad("ใส่ชื่อก่อน");if(!/^\d{4}$/.test(LG.pin))return bad("PIN ต้องเป็นตัวเลข 4 หลัก");
    email=await staffEmail(nm);pw="pin:"+LG.pin+":sahai";
    if(LG.reg){if(!LG.code.trim())return bad("ใส่รหัสเชิญร้านก่อน");meta={kind:"staff",code:LG.code.trim(),name:LG.name.trim().replace(/\s+/g," ")}}}
  else{email=LG.email.trim().toLowerCase();pw=LG.pw;if(!/^\S+@\S+\.\S+$/.test(email))return bad("ใส่อีเมลให้ถูกต้อง");if(pw.length<6)return bad("รหัสผ่านอย่างน้อย 6 ตัว");
    if(LG.reg){if(!LG.code.trim())return bad("ใส่รหัสเจ้าของร้านก่อน");meta={kind:"owner",code:LG.code.trim(),name:"เจ้าของ"}}}
  LG.busy=true;LG.msg="";showLogin();
  try{const r=LG.reg?await SB.cl.auth.signUp({email,password:pw,options:{data:meta}}):await SB.cl.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;if(!r.data.session)throw new Error("ลงทะเบียนแล้วแต่ยังเข้าไม่ได้ ลองกด “กลับไปเข้าสู่ระบบ”");
    LG.busy=false;LG.pin="";LG.pw="";LG.code="";unlockedOnce=true;boot()}
  catch(e){LG.busy=false;LG.msg=authMsg(e);showLogin()}
}

boot();
})();
</script>
